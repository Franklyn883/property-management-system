services:
    user-service:
        build: ./user-service
        volumes:
            - ./user-service:/user-service
        ports:
            - 8000:8000
        env_file:
            - ./user-service/.env.user
        command: python manage.py runserver 0.0.0.0:8000
        container_name: user-service
        networks:
            - backend-network
        depends_on:
            - user-db

    user-db:
        image: postgres:15
        env_file:
            - ./user-service/.env.user
        container_name: user-db

        ports:
            - "5432:5432"
        volumes:
            - user-pgdata:/var/lib/postgresql/data/
        networks:
            - backend-network

    property-service:
        build: ./property-service
        volumes:
            - ./property-service:/usr/src/app
        ports:
            - "5002:5002"
        env_file:
            - ./property-service/.env
        container_name: property-service
        command: npm start
        depends_on:
            - property-db
        networks:
            - backend-network

    property-db:
        image: mongo:4.4
        restart: always
        container_name: property-db
        ports:
            - "27018:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
            MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
        networks:
            - backend-network
        volumes:
            - property-db:/data/db

volumes:
    user-pgdata:
    property-db:

networks:
    backend-network:
        driver: bridge
